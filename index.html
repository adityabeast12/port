<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Aditya Shukla — AI Solutions Consultant</title>
  <meta name="description" content="Chat with Aditya Shukla's portfolio. He builds production-grade agentic AI, LLM/RAG pipelines, voice agents and ML models for banking and insurance, with guardrails built in.">
  <meta name="theme-color" content="#0a0a0b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ask Aditya — AI Solutions Consultant">
  <meta property="og:description" content="A portfolio you can talk to. Agentic AI, ML and responsible AI systems, shipped to production at banks in India and abroad.">
  <meta property="og:image" content="https://adityabeast12.github.io/port/assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Aditya Shukla",
    "jobTitle": "AI Solutions Consultant",
    "address": { "@type": "PostalAddress", "addressLocality": "Nagpur", "addressCountry": "IN" },
    "email": "mailto:adityabshukla12@gmail.com",
    "alumniOf": "G.H. Raisoni College of Engineering, Nagpur",
    "knowsAbout": ["Agentic AI", "Multi-agent systems", "LLM", "RAG", "Machine Learning", "Voice AI", "Responsible AI"],
    "sameAs": ["https://www.linkedin.com/in/aditya-shukla-2a86991b4/", "https://github.com/adityabeast12"]
  }
  </script>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="app">
    <header class="top">
      <button class="top__who" type="button" data-reset aria-label="Start a new chat">
        <img src="assets/img/aditya.webp" alt="" width="36" height="36">
        <span>
          <strong>Aditya Shukla</strong>
          <small><span class="dot"></span> AI Solutions Consultant</small>
        </span>
      </button>
      <nav class="top__links" aria-label="Links">
        <a href="https://www.linkedin.com/in/aditya-shukla-2a86991b4/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/adityabeast12" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:adityabshukla12@gmail.com" class="top__cta">Email me</a>
      </nav>
    </header>

    <main class="chat" id="chat" data-scroll>
      <div class="chat__inner">
        <section class="welcome" data-welcome>
          <div class="welcome__orb" aria-hidden="true"></div>
          <h1 class="welcome__title">Hi, I'm Aditya.</h1>
          <p class="welcome__sub">I build AI agents that banks trust. This portfolio is a chat, so ask me about my work, my stack or how I build safe AI.</p>
          <div class="suggest" data-suggest></div>
        </section>

        <div class="log" data-log role="log" aria-live="polite" aria-label="Conversation"></div>

        <noscript>
          <div class="noscript">
            <h2>Aditya Shukla — AI Solutions Consultant</h2>
            <p>I build production-grade AI agent systems, LLM/RAG pipelines and ML models for banking and insurance. My agentic banking assistant is live at four banks, three in India and one international. I have also built real-time voice onboarding agents, a multi-agent orchestration platform, a sales copilot, image-similarity validation for an international trade organisation in the UK, and churn, propensity and email-triage models.</p>
            <p>Contact: <a href="mailto:adityabshukla12@gmail.com">adityabshukla12@gmail.com</a></p>
          </div>
        </noscript>
      </div>
    </main>

    <footer class="composer">
      <form class="composer__form" data-form autocomplete="off">
        <label class="sr-only" for="q">Ask a question</label>
        <input id="q" name="q" type="text" placeholder="Ask me about my work" maxlength="300" enterkeyhint="send" data-input>
        <button type="submit" class="composer__send" aria-label="Send" data-send disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="composer__note">Answers are written by me, not generated. For anything else, <a href="mailto:adityabshukla12@gmail.com">email me</a>.</p>
    </footer>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
