<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Aditya Shukla</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/port/assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0a0c0b; color: #e8eeea; font-family: Poppins, system-ui, sans-serif; }
    .box { width: min(560px, 100%); background: #0f1211; border: 1px solid rgba(200, 255, 225, .16); border-radius: 10px; padding: 28px; font-family: "JetBrains Mono", monospace; font-size: 13.5px; line-height: 1.8; }
    .g { color: #3ee089; } .a { color: #f5b23d; } .d { color: #616b66; }
    h1 { font-family: Poppins, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -.02em; margin: 18px 0 8px; }
    a { display: inline-block; margin-top: 18px; background: #3ee089; color: #0a0c0b; text-decoration: none; font-family: Poppins, sans-serif; font-weight: 600; padding: 10px 18px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <div><span class="g">$</span> GET <span id="p">/…</span></div>
    <div><span class="a">404</span> <span class="d">route not found · no agent is deployed here</span></div>
    <h1>This page doesn't exist.</h1>
    <div class="d">The console is still up and running.</div>
    <a href="/port/">Back to the console</a>
  </div>
  <script>document.getElementById('p').textContent = location.pathname;</script>
</body>
</html>
